# 工作流的名称，会显示在 Actions 列表中
name: Build Android APK

# 触发工作流的事件
on:
  # 允许我们手动在 Actions 页面点击按钮来触发
  workflow_dispatch:

jobs:
  build:
    # 指定任务运行在 GitHub 的哪种虚拟服务器上
    runs-on: ubuntu-latest

    steps:
      # 第 1 步：获取您仓库的源代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 第 2 步：安装 Java 开发环境 (Android 编译需要)
      - name: Set up JDK 12
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "12.x"

      # 第 3 步：安装 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # 使用稳定版的 Flutter

      # 第 4 步：获取项目的所有依赖包
      - name: Get Flutter dependencies
        run: flutter pub get

      # 第 5 步：执行编译 APK 的命令
      - name: Build APK
        run: flutter build apk --release

      # 第 6 步：将编译好的 APK 文件打包上传，方便我们下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
