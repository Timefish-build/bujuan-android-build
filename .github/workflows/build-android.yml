# 工作流的名称
name: Build Android APK

# 允许我们手动在 Actions 页面点击按钮来触发
on:
  workflow_dispatch:

jobs:
  build-android:
    # 任务运行在 GitHub 的虚拟服务器上
    runs-on: ubuntu-latest
    steps:
      # 步骤 1: 获取主项目的源代码
      - name: Checkout main repository
        uses: actions/checkout@v3

      # 步骤 2: 获取并放置 API 仓库（关键步骤！）
      - name: Checkout bujuan_music_api repository
        uses: actions/checkout@v3
        with:
          repository: 2697a/bujuan_music_api
          path: bujuan_music_api
          
      # 步骤 3: 设置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 步骤 4: 设置 Rust 环境（关键步骤！）
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 步骤 5: 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 步骤 6: 获取 Flutter 项目的依赖
      - name: Get dependencies
        run: flutter pub get

      # 步骤 7: 编译 APK
      - name: Build APK
        run: flutter build apk --release

      # 步骤 8: 上传编译好的 APK 文件，方便我们下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
